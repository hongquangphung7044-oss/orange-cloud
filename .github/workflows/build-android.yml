name: Build Android OSS APK

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kotlin Compose 编译器插件 (Kotlin 2.1.20) 运行时需要 JetBrains Runtime (JBR) 21
      # 工具链 (vendor=JetBrains, implementation=vendor-specific)。foojay 无法下载该
      # vendor-specific JBR，因此直接安装 JBR 21，Gradle 会自动探测并匹配该工具链。
      - name: Setup JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Create local.properties
        run: echo "sdk.dir=" > local.properties

      - name: Build OSS Debug APK
        run: ./gradlew :app:assembleOssDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-debug
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
